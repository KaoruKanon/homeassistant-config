name: Kaoru Home check

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-check.yaml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size budget (150 KB gzipped)
        run: |
          bundle=../www/kaoru-home/kaoru-home.js
          size=$(gzip -9 -c "$bundle" | wc -c)
          limit=$((150 * 1024))
          echo "kaoru-home.js: $(wc -c < "$bundle") bytes, $size bytes gzipped (budget $limit)"
          echo "kaoru-home.js gzipped: $size / $limit bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$limit" ]; then
            echo "::error file=www/kaoru-home/kaoru-home.js::Bundle is $size bytes gzipped, over the $limit bytes budget"
            exit 1
          fi

      # Uses the runner's Google Chrome through playwright-core: no `playwright install`.
      - name: Browser component tests
        run: |
          CHROME="$(command -v google-chrome)" || { echo "::error::google-chrome not found on the runner"; exit 1; }
          export CHROME
          npm run test:browser
