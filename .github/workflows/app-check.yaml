name: Kaoru Home check

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-check.yaml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size budget (150 KB gzipped, all files)
        run: |
          size=0
          for f in $(find ../www/kaoru-home -name '*.js'); do size=$((size + $(gzip -9 -c "$f" | wc -c))); done
          limit=$((150 * 1024))
          echo "kaoru-home: $size bytes gzipped in total (budget $limit)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Kaoru Home is $size bytes gzipped, over the $limit bytes budget"
            exit 1
          fi

      # Uses the runner's Google Chrome through playwright-core: no `playwright install`.
      - name: Browser component tests
        run: |
          CHROME="$(command -v google-chrome)" || { echo "::error::google-chrome not found on the runner"; exit 1; }
          export CHROME
          npm run test:browser
