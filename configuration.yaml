homeassistant:
  name: Maison
  latitude: !secret homeassistant_latitude
  longitude: !secret homeassistant_longitude
  elevation: !secret homeassistant_elevation
  unit_system: metric
  temperature_unit: C
  time_zone: Europe/Paris
  language: fr
  country: FR
  currency: EUR
  packages: !include_dir_named packages
  customize_domain:
    automation:
      initial_state: true
  allowlist_external_dirs:
    - /config
  external_url: !secret external_url
  internal_url: !secret internal_url

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - !secret proxy

default_config:
automation: !include automations.yaml

frontend:
  themes: !include_dir_merge_named themes

# Kaoru Home: Maison (V2) is the front-end; Maison V1 stays during the transition.
panel_custom:
  - name: kaoru-home-v2
    sidebar_title: Maison
    sidebar_icon: mdi:home-variant
    url_path: maison-v2
    module_url: /local/kaoru-home/kaoru-home.js?v=0.2.0
    embed_iframe: false
    require_admin: false
  - name: kaoru-home
    sidebar_title: Maison V1
    sidebar_icon: mdi:home-outline
    url_path: maison
    module_url: /local/kaoru-home/kaoru-home.js?v=0.2.0
    embed_iframe: false
    require_admin: false

# recorder:
#   db_url: !secret recorder_db_url
#   exclude:
#     entity_globs:
#       - sensor.browser_*

influxdb:
  api_version: 2
  ssl: false
  host: !secret influx_homeassistant_host
  port: 8086
  token: !secret influx_homeassistant_token
  organization: !secret influx_homeassistant_org
  bucket: !secret influx_homeassistant_bucket
  tags:
    source: HA
  max_retries: 3
  default_measurement: state
  include:
    entity_globs:
      - sensor.*_temperature
      - sensor.temperature_*
      - sensor.smart_plug_*
      - sensor.lixee_*
      - sensor.openweathermap_*
      - sensor.metro_france_*

logger:
  default: warning
  logs:
    homeassistant.components.websocket_api: fatal
    custom_components.monitor_docker.helpers: error
    homeassistant.setup: error
    homeassistant.components.command_line.sensor: error
    homeassistant.components.rest.sensor: error
    homeassistant.helpers.service: error
    homeassistant.components.media_player: error
    homeassistant.helpers.entity: error
    homeassistant.helpers.event: fatal
    homeassistant.components.ipp: fatal
    homeassistant.helpers.template: error
    custom_components.xiaomi_miio_fan.fan: critical

sensor:
  - platform: time_date
    display_options:
      - time
      - date

spotcast:
  sp_dc: !secret sp_dc
  sp_key: !secret sp_key

yahoofinance:
  symbols:
    - AAPL
    - NVDA
    - NTOA.F
    - SXR8.DE
    - BTC-EUR
  show_trending_icon: true
  scan_interval:
    minutes: 30
